spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: ${SPRING_DATA_MONGODB_DATABASE:farmagro_s4}

  r2dbc:
    url: ${R2DBC_URL:r2dbc:mssql://localhost:1433/FARMAGRO_SA}
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 30
      max-idle-time: 30m
      validation-query: SELECT 1

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# Operations endpoints for Kubernetes probes and Prometheus. Only health and prometheus are exposed;
# the liveness/readiness groups look at the application state, not at the databases, so a database
# outage does not make Kubernetes restart the pod.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: farmagro-backend
