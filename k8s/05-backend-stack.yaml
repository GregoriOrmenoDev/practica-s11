apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: practica-s11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: gregoriormenosanchez/farmagro-backend-funcional:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-configmap   # variables no sensibles
            - secretRef:
                name: db-secret       # credenciales sensibles
          env:
            # URI de Mongo construida con el DNS interno del clúster
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@mongo-service:27017/farmagro_s4?authSource=admin"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s11
spec:
  type: NodePort           # accesible desde fuera del clúster
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
