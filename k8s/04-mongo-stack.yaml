apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: practica-s11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: db-secret
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db   # ruta estándar de datos de MongoDB
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: practica-s11
spec:
  type: ClusterIP          # solo accesible dentro del clúster
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
